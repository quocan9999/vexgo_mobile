name: Flutter CI

on:
  pull_request:
    branches: [develop, feature/mobile-discovery-ui, feature/mobile-seat-pickup-ui-redesign, feature/mobile-passenger-info-ui, feature/mobile-trip-summary-ui]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.7'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Format, analyze and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up the verified Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify source and toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PY'
          import json, os, pathlib
          version = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'flutter-version.json').read_text())
          assert version['frameworkVersion'] == os.environ['FLUTTER_VERSION'], version
          assert version['dartSdkVersion'].split()[0] == '3.10.7', version
          PY

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      # Run before tests/build create generated build directories.
      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Tests
        run: flutter test --no-pub

  android:
    name: Debug APK and artifact
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the same candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up the same Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare public-only build configuration
        env:
          SEPAY_BANK_ID: ${{ vars.SEPAY_BANK_ID }}
          SEPAY_ACCOUNT_NUMBER: ${{ vars.SEPAY_ACCOUNT_NUMBER }}
          SEPAY_ACCOUNT_NAME: ${{ vars.SEPAY_ACCOUNT_NAME }}
          API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import json, os, pathlib
          values = {'DEMO_MODE': 'false'}
          keys = ('SEPAY_BANK_ID', 'SEPAY_ACCOUNT_NUMBER', 'SEPAY_ACCOUNT_NAME', 'API_BASE_URL')
          values.update({key: os.environ[key] for key in keys if os.environ.get(key)})
          pathlib.Path('.dart_tool/ci-public-defines.json').write_text(json.dumps(values), encoding='utf-8')
          # Record flags only; never upload receiving-account configuration.
          flags = {'bank_fields_provided': all(values.get(key) for key in keys[:3]),
                   'custom_api_url_provided': bool(values.get('API_BASE_URL'))}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'build-config-flags.json').write_text(json.dumps(flags))
          PY

      - name: Build debug APK in Real Mode
        run: flutter build apk --debug --no-pub --dart-define-from-file=.dart_tool/ci-public-defines.json

      - name: Record APK provenance and checksum
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          apk = pathlib.Path('build/app/outputs/flutter-apk/app-debug.apk')
          with apk.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['SOURCE_SHA']
          flags = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'build-config-flags.json').read_text())
          metadata = {'source_sha': source, 'flutter_version': os.environ['FLUTTER_VERSION'],
                      'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'apk_bytes': apk.stat().st_size, 'apk_sha256': digest, 'demo_mode': False,
                      'device_e2e_verified': False, 'bank_settlement_verified': False, **flags}
          (apk.parent / 'build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (apk.parent / 'SHA256SUMS').write_text(f'{digest}  app-debug.apk\n')
          with pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f'### Debug APK\n\nSource: `{source}`\n\nSHA256: `{digest}`\n\n')
              summary.write('Real Mode build; CI does not verify Android E2E or bank settlement.\n')
              if not flags['bank_fields_provided']:
                  summary.write('No public receiving-bank config supplied: positive-amount VietQR checkout remains blocked.\n')
          PY

      - name: Upload APK and provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vexgo-debug-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/build-metadata.json
            build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
